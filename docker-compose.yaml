version: "3.9"

services:
  turtlebot4:
    image: turtlebot4_docker
    container_name: turtlebot4
    network_mode: "host"
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: "${DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      TURTLEBOT4_CONTAINER: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/dot.Xauthority:rw
      - ./shared:/home/${USER}:rw
